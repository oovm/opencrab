name: CI

on:
    push:
        branches: [master, dev]
        tags:
            - 'v*'
    pull_request:
        branches: [master, dev]

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    rust-check:
        name: Rust Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@nightly
              with:
                  components: rustfmt, clippy

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Run clippy
              run: cargo clippy --workspace --all-targets --all-features -- -D warnings

            - name: Check compilation
              run: cargo check --workspace --all-targets --all-features

    rust-test:
        name: Rust Test
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                feature: [no-default, default, all]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@nightly

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Run tests (no-default features)
              if: matrix.feature == 'no-default'
              run: cargo test --workspace --no-default-features

            - name: Run tests (default features)
              if: matrix.feature == 'default'
              run: cargo test --workspace

            - name: Run tests (all features)
              if: matrix.feature == 'all'
              run: cargo test --workspace --all-features

    release:
        name: Release
        needs: [rust-check, rust-test]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@nightly

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-release-

            - name: Build release binary
              run: cargo build --release --workspace

            - name: Determine artifact name (Windows)
              if: matrix.os == 'windows-latest'
              shell: bash
              run: |
                  echo "ARTIFACT_NAME=opencrab-${{ github.ref_name }}-windows-x86_64.zip" >> $GITHUB_ENV
                  echo "BIN_PATH=target/release/opencrab.exe" >> $GITHUB_ENV

            - name: Determine artifact name (macOS)
              if: matrix.os == 'macos-latest'
              shell: bash
              run: |
                  echo "ARTIFACT_NAME=opencrab-${{ github.ref_name }}-darwin-x86_64.tar.gz" >> $GITHUB_ENV
                  echo "BIN_PATH=target/release/opencrab" >> $GITHUB_ENV

            - name: Determine artifact name (Linux)
              if: matrix.os == 'ubuntu-latest'
              shell: bash
              run: |
                  echo "ARTIFACT_NAME=opencrab-${{ github.ref_name }}-linux-x86_64.tar.gz" >> $GITHUB_ENV
                  echo "BIN_PATH=target/release/opencrab" >> $GITHUB_ENV

            - name: Package artifact (Windows)
              if: matrix.os == 'windows-latest'
              shell: bash
              run: |
                  7z a ${{ env.ARTIFACT_NAME }} ${{ env.BIN_PATH }}

            - name: Package artifact (macOS/Linux)
              if: matrix.os != 'windows-latest'
              shell: bash
              run: |
                  chmod +x ${{ env.BIN_PATH }}
                  tar -czf ${{ env.ARTIFACT_NAME }} -C target/release opencrab

            - name: Upload release asset
              uses: softprops/action-gh-release@v2
              with:
                  files: ${{ env.ARTIFACT_NAME }}
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
